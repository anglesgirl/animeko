name: diag-captcha
on: [workflow_dispatch, push]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 分析打包JS的验证码逻辑
        run: |
          cd /tmp
          UA="Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36"
          curl -sL -A "$UA" -c c.txt -o login.html "https://bgm.tv/login"
          curl -s -A "$UA" -b c.txt -e "https://bgm.tv/login" -o app.js "https://bgm.tv/min/g=js?r771"
          wc -c app.js
          echo "=== genCaptcha / showCaptcha / submit 逻辑 ==="
          grep -oE '.{120}(genCaptcha|showCaptcha).{200}' app.js | head -10
          echo "=== submit 相关 ==="
          grep -oE '.{80}(submit|loginForm).{160}' app.js | head -12
