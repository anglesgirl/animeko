name: ECH Check

on:
  push:
    branches: [ech-bgm]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JetBrains JDK 21 (Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: List module tasks
        run: ./gradlew :utils:ktor-client:tasks --all --no-daemon 2>&1 | grep -iE "assemble|compile.*kotlin" | head -20
