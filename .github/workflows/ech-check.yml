name: ECH Check

on:
  push:
    branches: [ech-bgm]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile ktor-client Android
        run: ./gradlew :utils:ktor-client:compileDebugKotlinAndroid --no-daemon --stacktrace
