name: ECH Check

on:
  push:
    branches: [ech-bgm]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JetBrains JDK 21 (Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build ktor-client Android
        run: ./gradlew :utils:ktor-client:assembleAndroidMain --no-daemon --stacktrace

      - name: Build app debug APK
        run: ./gradlew :app:android:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animeko-ech-debug
          path: app/android/build/outputs/apk/default/debug/*.apk
          retention-days: 14

      - name: Notify build result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/notify-ech-check.sh
