name: ECH Check

on:
  push:
    branches: [ech-conscrypt]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Write ECH DoH pool
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          if [ -n "$ECH_DOH_POOL" ]; then echo "echDohPool=$ECH_DOH_POOL" > local.properties; fi
          echo "ani.android.debug.applicationIdSuffix=" >> local.properties

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/android/google-services.json
            echo "ani.enable.firebase=true" >> local.properties
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JetBrains JDK 21 (Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup release signing keystore (固定签名，所有版本同一 keystore)
        env:
          ECH_KEYSTORE_BASE64: ${{ secrets.ECH_KEYSTORE_BASE64 }}
          ECH_KEYSTORE_PASSWORD: ${{ secrets.ECH_KEYSTORE_PASSWORD }}
          ECH_KEYSTORE_ALIAS: ${{ secrets.ECH_KEYSTORE_ALIAS }}
        run: |
          # 固定 release keystore：解码后所有版本用同一签名，保证用户可覆盖安装升级
          if [ -n "$ECH_KEYSTORE_BASE64" ]; then
            echo "$ECH_KEYSTORE_BASE64" | base64 -d > /tmp/ech-release.keystore
            echo "signing_release_storeFileFromRoot=/tmp/ech-release.keystore" >> local.properties
            echo "signing_release_storePassword=$ECH_KEYSTORE_PASSWORD" >> local.properties
            echo "signing_release_keyAlias=$ECH_KEYSTORE_ALIAS" >> local.properties
            echo "signing_release_keyPassword=$ECH_KEYSTORE_PASSWORD" >> local.properties
          else
            # 无 keystore 时退回 debug 签名（仅用于临时构建，不作为正式发布）
            keytool -genkey -keystore /tmp/ech-debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            echo "signing_release_storeFileFromRoot=/tmp/ech-debug.keystore" >> local.properties
            echo "signing_release_storePassword=android" >> local.properties
            echo "signing_release_keyAlias=androiddebugkey" >> local.properties
            echo "signing_release_keyPassword=android" >> local.properties
          fi

      - name: Setup Android NDK (供 cargo-ndk 编译 H3 原生库)
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK/ndk" ] && [ -n "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
            NDK_DIR=$(ls -d "$SDK"/ndk/* | sort -V | tail -1)
          else
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
            NDK_DIR="$SDK/ndk/27.1.12297006"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK_DIR"

      - name: Setup Rust (H3 native lib)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo (native-h3)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-h3

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: 取 quiche 源码并打 ECH 补丁
        run: |
          set -e
          curl -sSL https://static.crates.io/crates/quiche/quiche-0.22.0.crate -o /tmp/quiche.crate
          mkdir -p native-h3/vendor && tar -xzf /tmp/quiche.crate -C native-h3/vendor
          rm -rf native-h3/vendor/quiche && mv native-h3/vendor/quiche-0.22.0 native-h3/vendor/quiche
          python3 tools/patch_quiche.py native-h3/vendor/quiche

      - name: 编 H3 原生库（铁律：只留主库 + llvm-nm 验 JNI 符号）
        run: |
          set -e
          cd native-h3
          cargo ndk -t arm64-v8a -o ../app/android/src/main/jniLibs build --release --lib
          find ../app/android/src/main/jniLibs -name "libquiche*.so" -delete
          ls -la ../app/android/src/main/jniLibs/arm64-v8a/
          NM=$(find "${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk}" -name llvm-nm -type f 2>/dev/null | head -1)
          echo "llvm-nm: $NM"
          for abi in arm64-v8a; do
            n=$($NM -D ../app/android/src/main/jniLibs/$abi/libani_h3.so | grep -c "Java_me_him188_ani_android_ech_AniEchH3_h3Fetch" || true)
            echo "$abi JNI 符号命中: $n"
            [ "$n" -gt 0 ] || { echo "✗ $abi 缺 JNI 符号"; exit 1; }
          done

      - name: Build app release APK
        run: |
          ./gradlew :app:android:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-check.log; exit ${PIPESTATUS[0]}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: animeko-ech-release
          path: app/android/build/outputs/apk/default/release/*.apk
          retention-days: 14

      - name: Notify build result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/notify-ech-check.sh
