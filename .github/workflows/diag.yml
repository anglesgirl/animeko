name: diag-bgm
on: [workflow_dispatch, push]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch BGM login page
        run: |
          UA="Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36"
          curl -sL -A "$UA" -c /tmp/bgm_cookies.txt -o /tmp/bgm_login.html -w "HTTP=%{http_code}\n" "https://bgm.tv/login"
          echo "===== SCRIPTS ====="
          grep -oE 'src="[^"]+"' /tmp/bgm_login.html | head -20
          echo "===== INLINE JS captcha lines ====="
          grep -nE 'captcha|seccode|idhash|challenge' /tmp/bgm_login.html | head -20
