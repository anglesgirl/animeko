name: diag-form
on: [push]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 抓登录页表单字段
        run: |
          UA="Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36"
          curl -sL -A "$UA" -c /tmp/c.txt -o /tmp/login.html "https://bgm.tv/login"
          echo "=== form 所有控件 ==="
          python3 - <<'PY'
import re
h=open('/tmp/login.html',encoding='utf-8',errors='ignore').read()
# 找 login form
for m in re.finditer(r'<form[^>]*action="([^"]*)"[^>]*>',h):
    print("FORM action:", m.group(1))
# 所有 input
for m in re.finditer(r'<input[^>]*>',h):
    tag=m.group(0)
    if any(k in tag for k in ['formhash','referer','dreferer','email','password','captcha','cookietime','submit','loginsubmit']):
        name=re.search(r'name="([^"]*)"',tag)
        val=re.search(r'value="([^"]*)"',tag)
        typ=re.search(r'type="([^"]*)"',tag)
        print("INPUT name=%s type=%s value=%s" % (name.group(1) if name else '?', typ.group(1) if typ else '?', (val.group(1)[:30] if val else '')))
# 所有 button/提交
for m in re.finditer(r'<button[^>]*>|<\w+[^>]*type="submit"[^>]*>',h):
    tag=m.group(0)
    name=re.search(r'name="([^"]*)"',tag)
    val=re.search(r'value="([^"]*)"',tag)
    print("BTN:", re.search(r'<\w+',tag).group(0), "name=%s"%(name.group(1) if name else '-'), "value=%s"%(val.group(1)[:20] if val else '-'))
PY
          echo "=== genCaptcha / showCaptcha JS ==="
          grep -o 'loginsubmit\|submit[^"]*"[^>]*value="[^"]*"\|showCaptcha[^;]*' /tmp/login.html | head -10
